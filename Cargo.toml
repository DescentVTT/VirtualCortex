[workspace]
members = [
    "crates/cortex-core",
    "crates/cortex-connectome",
    "crates/cortex-sensory",
    "crates/cortex-embodiment",
    "crates/cortex-basal-ganglia",
    "crates/cortex-cerebellum",
    "crates/cortex-salience",
    "crates/cortex-workspace",
    "crates/cortex-symbolic",
    "crates/cortex-executive",
    "crates/cortex-predictive",
    "crates/cortex-agency",
    "crates/cortex-immune",
    "crates/cortex-neuromod",
    "crates/cortex-hippocampus",
    "crates/cortex-homeostasis",
    "crates/cortex-fabric",
    "crates/cortex-telemetry",
    # Admitted by ADR-0016 (2026-09-10); whitepaper §5.2.19 to §5.2.32.
    "crates/cortex-thalamus",
    "crates/cortex-linguistic",
    "crates/cortex-tools",
    "crates/cortex-attention",
    "crates/cortex-affect",
    "crates/cortex-autonomic",
    "crates/cortex-spatial",
    "crates/cortex-curiosity",
    "crates/cortex-social",
    "crates/cortex-ethics",
    "crates/cortex-knowledge",
    "crates/cortex-reasoning",
    "crates/cortex-arithmetic",
    "crates/cortex-imagination",
    # Not a state crate: benchmarks only, never published (ADR-0014).
    "benches/cortex-bench",
]
# Resolver 3 (Rust 1.84+) is MSRV-aware: it prefers dependency versions whose rust-version
# is within the workspace's (ADR-0009).
resolver = "3"

# Shared package metadata, inherited by every crate (whitepaper finding F-9).
# Edition and rust-version are decided by ADR-0009 (accepted); changing either is a new
# ADR, not a passing edit. The toolchain CI and contributors build with is pinned in
# rust-toolchain.toml; rust-version is the floor a second CI job builds and tests on.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["VirtualCortex maintainers"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/DescentVTT/VirtualCortex"
