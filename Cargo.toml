[workspace]
members = [
    "crates/menteion-core",
    "crates/menteion-connectome",
    "crates/menteion-sensory",
    "crates/menteion-embodiment",
    "crates/menteion-basal-ganglia",
    "crates/menteion-cerebellum",
    "crates/menteion-salience",
    "crates/menteion-workspace",
    "crates/menteion-symbolic",
    "crates/menteion-executive",
    "crates/menteion-predictive",
    "crates/menteion-agency",
    "crates/menteion-immune",
    "crates/menteion-neuromod",
    "crates/menteion-hippocampus",
    "crates/menteion-homeostasis",
    "crates/menteion-fabric",
    "crates/menteion-telemetry",
    # Admitted by ADR-0016 (2026-09-10); whitepaper §5.2.19 to §5.2.32.
    "crates/menteion-thalamus",
    "crates/menteion-linguistic",
    "crates/menteion-tools",
    "crates/menteion-attention",
    "crates/menteion-affect",
    "crates/menteion-autonomic",
    "crates/menteion-spatial",
    "crates/menteion-curiosity",
    "crates/menteion-social",
    "crates/menteion-ethics",
    "crates/menteion-knowledge",
    "crates/menteion-reasoning",
    "crates/menteion-arithmetic",
    "crates/menteion-imagination",
    # Not a state crate: the executor, never published (ADR-0023). Outside `crates/`, so the
    # TC-4, TC-5 and TC-9 directives that hold the state crates do not reach it; ADR-0023 holds it.
    "runtime/menteion-runtime",
    # Not a state crate: benchmarks only, never published (ADR-0014).
    "benches/menteion-bench",
]
# Resolver 3 (Rust 1.84+) is MSRV-aware: it prefers dependency versions whose rust-version
# is within the workspace's (ADR-0009).
resolver = "3"

# Lints every state crate and the benchmark crate inherit with `[lints] workspace = true`
# (ADR-0029). TC-9: no `unsafe` in a state crate, a compiler error rather than a directive; the
# runtime crate, which holds the workspace's one `unsafe` (ADR-0023), carries its own `[lints]`
# table without this line. TC-4: no `f32` or `f64` anywhere, the types named in clippy.toml.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
disallowed_types = "deny"

# Shared package metadata, inherited by every crate (whitepaper finding F-9).
# Edition and rust-version are decided by ADR-0009 (accepted); changing either is a new
# ADR, not a passing edit. The toolchain CI and contributors build with is pinned in
# rust-toolchain.toml; rust-version is the floor a second CI job builds and tests on.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Menteion maintainers"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/Menteion/Menteion"

# Exploration 006, on `explore/006-where-an-arm-spends-its-time` alone (ADR-0193): the release
# profile with whole-program optimisation, and two partial forms of it, for the test binaries an
# arm runs (`cargo test --profile <name>`). Never on `main`, which has no `[profile]`.
[profile.lto-fat]
inherits = "release"
lto = "fat"
codegen-units = 1

[profile.lto-thin]
inherits = "release"
lto = "thin"

[profile.cgu1]
inherits = "release"
codegen-units = 1
