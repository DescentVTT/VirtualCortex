# cargo-mutants configuration (ADR-0030). The tool is an external, pinned binary; nothing in a
# manifest changes for it. CI runs it on the lines a pull request changes (`--in-diff`), and a
# mutant that survives in those lines fails the check: the test that constrains a new rule must
# exist, and must fail when the rule is wrong. The whole tree is run weekly by CI and by hand
# when a round ends (`cargo mutants --workspace`); its survivors are listed in whitepaper §11
# or become tests.

# The benchmark crate is measurement, not logic.
exclude_globs = ["benches/**"]

# Every test binary is built with the lock the rest of CI uses. A mutant is tested against its
# own crate's tests (the tool's default): a runtime test never kills a state-crate mutant, which
# is why every rule carries its tests in its own crate.
additional_cargo_test_args = ["--locked"]

# Mutants that are equivalent to the original by construction, each with the reason. A pattern
# here matches the mutant's description ("replace X with Y in f"); keep the function name in it,
# so that the exclusion never hides a real defect elsewhere.
exclude_re = [
    # `a | b` on disjoint bit fields is `a ^ b`: a packed word or a token whose fields never
    # overlap (the shift moved them apart, or the mask cleared the bit first).
    "cortex-arithmetic/src/lib\\.rs:\\d+:\\d+: replace \\| with \\^ in join",
    "wheel\\.rs:\\d+:\\d+: replace \\| with \\^ in FlatTimingWheel<CAP>::schedule",
    "cortex-cerebellum/src/lib\\.rs:\\d+:\\d+: replace \\| with \\^ in CerebellarMicrozone::step_forward_model",
    "synapse\\.rs:\\d+:\\d+: replace \\| with \\^ in synapse_token",
    # The chain word's low 28 bits are cleared before the index + 1 is written into them
    # (ADR-0032).
    "synapse\\.rs:\\d+:\\d+: replace \\| with \\^ in SynapseBlock::link",
    "synapse\\.rs:\\d+:\\d+: replace \\| with \\^ in spike_message",
    "synapse\\.rs:\\d+:\\d+: replace \\| with \\^ in synaptic_message",
    # A clamp compared at its own bound: `if v > MAX { MAX } else { v }` and `>=` agree at
    # `v == MAX`, and likewise `<` and `<=` at `MIN`. (`cortex-cerebellum`'s clamps left this
    # class under ADR-0062: a `min`, or a range pattern where a `const fn` cannot call one.)
    "membrane\\.rs:\\d+:\\d+: replace > with >= in add",
    "membrane\\.rs:\\d+:\\d+: replace < with <= in add",
    "synapse\\.rs:\\d+:\\d+: replace > with >= in spike_message",
    "synapse\\.rs:\\d+:\\d+: replace < with <= in spike_message",
    # The period's clamp in `istdp_alpha_q1_15`, compared at both its bounds.
    "synapse\\.rs:\\d+:\\d+: replace < with <= in istdp_alpha_q1_15",
    "synapse\\.rs:\\d+:\\d+: replace > with >= in istdp_alpha_q1_15",
    "cortex-linguistic/src/lib\\.rs:\\d+:\\d+: replace \\| with \\^ in required_roles",
    "term\\.rs:\\d+:\\d+: replace \\| with \\^ in literal_of_term",
    # A rotation joins the high bits of one word with the low bits of the next, which the two
    # shifts put in disjoint positions; and a bit-sliced comparison joins "above" with
    # "equal", which are disjoint by construction (ADR-0039).
    "body\\.rs:\\d+:\\d+: replace \\| with \\^ in HypervectorBody::permute",
    "body\\.rs:\\d+:\\d+: replace \\| with \\^ in HypervectorBody::bundle",
    # `leak(v)` at `v == 0`: the `> 0` and `< 0` arms both yield 0 there (`.min(v)` is 0), so
    # `>=` and `<=` agree with them.
    "membrane\\.rs:\\d+:\\d+: replace > with >= in leak",
    "membrane\\.rs:\\d+:\\d+: replace < with <= in leak",
    # A bound the domain cannot reach: a mailbox head of exactly `u32::MAX` is node
    # `u32::MAX - 1`, which needs an arena of 2^32 nodes, so `>` and `>=` differ at a head no test
    # can build. (The block bound, `too_many_blocks`, is a function a unit test holds at its
    # edge, so it needs no entry here.)
    "neuron\\.rs:\\d+:\\d+: replace > with >= in DendriticSuperNeuron::mailbox_push",
    # Scheduling hints with no observable result: how many times a barrier spins before it
    # yields. (The stack reserve's product and the I/O loops' offset steps are named operations
    # since brief 016, so they have no arithmetic mutant to exclude.)
    "barrier\\.rs:\\d+:\\d+: replace << with >>$",
    "barrier\\.rs:\\d+:\\d+: replace < with (==|>|<=) in SpinBarrier::wait",
    # The positioned read and write are the platform's one call each, under `cfg`: `seek_read`
    # and `seek_write` are the Windows forms, which no CI runner compiles, so their mutants
    # meet no test there; the Unix forms, `pread` and `pwrite`, and the loop around both,
    # `read_at` and `write_at`, are compiled and tested by every runner and have no entry
    # (ADR-0062). A Windows developer machine sees the mirror image, `pread` and `pwrite`
    # missed; CI's runner is the gate's truth (ADR-0030).
    "image\\.rs:\\d+:\\d+: replace (seek_read|seek_write) -> io::Result<usize> with Ok\\(\\d+\\)",
    # Dropping the executor stops its workers; a mutant that leaks them is hidden by the end
    # of the test process.
    "executor\\.rs:\\d+:\\d+: replace <impl Drop for Executor<CAP>>::drop with \\(\\)",
    # `difference < 0` after the `== 0` arm has been taken: `<=` cannot see a zero there.
    "injector\\.rs:\\d+:\\d+: replace < with <= in Injector::(push|pop)",
    # The shorter way round a ring: at equality both arms are the same distance.
    "prior\\.rs:\\d+:\\d+: replace < with <= in ring_distance",
    # A stack reservation's slack: the megabyte above eight wheels is not observable by a
    # test that does not overflow (F-34).
    "executor\\.rs:\\d+:\\d+: replace << with >> in build_wheels",
    # A bound the domain cannot reach: a block slice of 2^28 blocks is 16 GiB, so `>` and its
    # neighbours differ at a length no test can allocate.
    "synthesis\\.rs:\\d+:\\d+: replace > with (==|>=) in synthesize",
    # The rank's last key is the unit's index, and a unit is ranked once (a ranked unit's
    # later spikes are skipped), so two keys never share it: `<` and `<=` agree on every
    # comparison the rule makes (ADR-0048).
    "capture\\.rs:\\d+:\\d+: replace < with <= in before",
]
