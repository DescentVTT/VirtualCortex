[package]
name = "cortex-runtime"
description = "The VirtualCortex executor: worker threads, work-stealing deques, barrier-separated ticks, mailbox delivery and synaptic fan-out over the state crates (whitepaper §6.1; ADR-0023). Not a state crate; never published."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

# Dependencies flow from the runtime downward to the state crates, never the other way
# (ADR-0005). No third-party dependency: the deque, the barrier and the injector are in-house
# (ADR-0023).
[dependencies]
cortex-core = { path = "../../crates/cortex-core" }
cortex-connectome = { path = "../../crates/cortex-connectome" }
# The amendment record and the veto gate it is admitted through (ADR-0031).
cortex-executive = { path = "../../crates/cortex-executive" }
cortex-ethics = { path = "../../crates/cortex-ethics" }
# The modulator of three-factor plasticity (ADR-0032).
cortex-neuromod = { path = "../../crates/cortex-neuromod" }
# The homeostasis record: the branching-ratio estimator and the synaptic gain (ADR-0036).
cortex-homeostasis = { path = "../../crates/cortex-homeostasis" }

# Not the workspace table: the runtime holds the one `unsafe` (ADR-0023). The float rule
# still applies (ADR-0029).
[lints.clippy]
disallowed_types = "deny"
