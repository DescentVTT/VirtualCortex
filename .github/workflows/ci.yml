# CI for VirtualCortex.
#
# Seven jobs (one on pull requests only, two weekly or by hand), eight questions:
#   rust  - does the workspace compile, do its layout assertions and tests hold,
#           is it formatted and lint-clean (the workspace lints of ADR-0029 included),
#           does rustdoc build without a warning, do the tests also hold in the release
#           profile (the engine's, without overflow checks), and do the benchmarks still
#           execute? All seven steps are blocking; the benchmark step asserts no timing
#           (ADR-0014): a shared runner cannot hold a latency threshold. The
#           toolchain is the one pinned in rust-toolchain.toml (ADR-0009).
#   msrv  - does the workspace still build and test on the minimum supported
#           Rust version declared in Cargo.toml? The floor is read from the
#           manifest, so it lives in one place.
#   specs - does the source tree still contain what the documents say it contains
#           (spec-guard), are the documents consistent with one another
#           (spec-graph), does every live brief carry its mandatory sections and, from
#           brief 028, a Latest ≠ Newest standing directive (scripts/check-briefs.mjs, with
#           its own node:test cases), and do the manifests keep TC-2, state crates
#           without dependencies (scripts/check-deps.mjs)? All blocking. Actions are
#           pinned to commits and the runner image to a release (ADR-0029).
#   arm64 - do the tests hold on AArch64, and does the seeded network hash to the value
#           pinned on x86-64 (target T-1; ADR-0030)?
#   mutants - on a pull request: is every mutant cargo-mutants can make in the lines the
#           request changes caught by a test (ADR-0030)? A rule without a test that fails
#           when the rule is wrong does not pass it. Pinned tool, no manifest change.
#           The ruleset "Main Protect" requires the rust, msrv and specs checks by name
#           before a merge; the other jobs are not required, so a rename of those three
#           is a change to the ruleset first.
#   weekly - on a schedule (or by hand): do the whole-domain tests still hold?
#   mutants-weekly - on the same schedule: which mutants survive over the whole tree? One job
#           per area, the runtime's in six shards, each deriving its per-mutant bound from its
#           own suite timed on its runner and failing if it did not cover its slice (ADR-0058).
#           Nothing is blocked; the survivors are the next round's list (ADR-0030).
#           Whitepaper Appendix B describes the levels.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, Monday 03:00 UTC: the whole-domain tests and the whole-tree mutation run
    # (ADR-0030). Nothing to block; the survivors are the next round's list.
    - cron: "0 3 * * 1"
  # The weekly jobs by hand: `gh workflow run ci.yml --ref <branch> -f scope=<scope>`. A round
  # dispatches `exhaustive`, where its own measurement lives; `mutants` as well only when it
  # added or removed a test, moved one between the gate and the weekly job, or changed the
  # sweep itself (ADR-0067). A scheduled run always does both.
  workflow_dispatch:
    inputs:
      scope:
        description: Which weekly jobs to run
        type: choice
        default: both
        options:
          - both
          - exhaustive
          - mutants

permissions:
  contents: read

concurrency:
  # The event is part of the group, so a push to main does not cancel a running weekly job.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    # The name is a required status check of the repository's ruleset; the header above
    # says what the job runs.
    name: Rust (check, test, fmt, clippy)
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install the pinned toolchain (rust-toolchain.toml, ADR-0009)
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check
        run: cargo check --workspace --all-targets --locked

      - name: Test
        run: cargo test --workspace --locked

      - name: Test in the release profile (the engine's; no overflow checks) (ADR-0030)
        run: cargo test --workspace --release --locked

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rustdoc builds without a warning (ADR-0029)
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Benchmarks execute (one iteration each, no timing asserted)
        run: cargo bench -p cortex-bench --bench hot_path --locked -- --test

  msrv:
    name: Rust (minimum supported version)
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Select the rust-version declared in Cargo.toml (an override outranks rust-toolchain.toml)
        run: |
          msrv="$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)"
          test -n "$msrv"
          rustup toolchain install "$msrv" --profile minimal
          rustup override set "$msrv"
          rustc -V

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check on the MSRV
        run: cargo check --workspace --all-targets --locked

      - name: Test on the MSRV
        run: cargo test --workspace --locked

  arm64:
    name: Rust (AArch64 determinism, T-1)
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install the pinned toolchain (rust-toolchain.toml, ADR-0009)
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Test on AArch64, the pinned arena hash included
        run: cargo test --workspace --locked

  mutants:
    name: Mutation gate on the changed lines (ADR-0030)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Install the pinned toolchain (rust-toolchain.toml, ADR-0009)
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # One cache for the mutation jobs, saved by the weekly run on main, so a new pull
          # request restores the built tool instead of compiling it; saved even when the gate
          # fails, so a red run still pays for the next.
          shared-key: mutants
          cache-on-failure: true

      - name: Install cargo-mutants at its pin (cached by rust-cache once built)
        run: cargo install cargo-mutants --locked --version 27.1.0

      - name: The lines this pull request changes
        run: git diff "origin/${{ github.base_ref }}...HEAD" > "${{ runner.temp }}/pr.diff"

      - name: Every mutant in those lines is caught (.cargo/mutants.toml)
        # Exit 2 is a survivor, 3 a timeout: a mutant that hangs a test is a mutant the tests
        # detected, so the step fails on survivors (missed.txt) and on the tool's own errors, not
        # on timeouts. Every other exit code is the tool's failure and fails the step.
        run: |
          set +e
          cargo mutants --workspace --in-diff "${{ runner.temp }}/pr.diff" --jobs 2 --annotations github
          rc=$?
          set -e
          case "$rc" in
            0|2|3) ;;
            *) echo "cargo-mutants failed with exit code $rc"; exit "$rc" ;;
          esac
          if [ -s mutants.out/missed.txt ]; then
            echo "Mutants that survived in the changed lines:"; cat mutants.out/missed.txt; exit 2
          fi
          echo "no survivor; timeouts, if any, are listed in mutants.out/timeout.txt"

  weekly:
    name: Weekly (exhaustive tests)
    # `inputs` is empty on a push or a pull request, so those skip this as before; on a
    # schedule the first clause carries it, whatever `inputs.scope` is (ADR-0067).
    if: github.event_name == 'schedule' || inputs.scope == 'both' || inputs.scope == 'exhaustive'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install the pinned toolchain (rust-toolchain.toml, ADR-0009)
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: mutants

      - name: The whole-domain tests, in the release profile
        run: |
          set -o pipefail
          cargo test --workspace --release --locked -- --ignored exhaustive 2>&1 | tee exhaustive.log

      # This job reported one number for every `exhaustive` test in the tree, so what a round
      # added to it could not be seen: the job read 32, 55, 33, 40, 71, 69 and 69 minutes over
      # seven runs while about twenty-one heavy runs were added, and two runs of identical
      # content read 40 and 71 (F-45, ADR-0071). `--report-time` is nightly-only on the pinned
      # toolchain (ADR-0009), but cargo already prints a result line per test binary and that
      # line carries the seconds; this reads them. It decides nothing: sharding the job the way
      # ADR-0058 sharded the sweep is a decision for a round that has these numbers.
      - name: What each binary of the whole-domain tests took (F-45, ADR-0071)
        if: always()
        run: |
          cat > times.awk <<'AWK'
          # Pairs cargo's "Running <source> (<binary>)" line with the "test result:" line after
          # it; cargo runs test binaries one after another, so the order is the pairing. A
          # binary that ran none of them is left out.
          /^[[:space:]]*Running/ {
            bin = $0
            sub(/^[^(]*\(/, "", bin)
            sub(/\).*$/, "", bin)
            sub(/.*\//, "", bin)
            sub(/\.exe$/, "", bin)
            sub(/-[0-9a-f]+$/, "", bin)
          }
          # The job runs on ubuntu, so the separator is "/"; a Windows log read locally keeps
          # its directories in the name, which is cosmetic. A doc-test section has no binary of
          # its own, and naming it keeps the previous binary's name off it if one ever runs
          # these tests: under `--ignored exhaustive` all thirty-three of them report none.
          /^[[:space:]]*Doc-tests/ { bin = "doc-tests:" $2 }   # no space: the table splits on fields
          /^test result:/ {
            secs = $NF
            sub(/s$/, "", secs)
            if ($4 + 0 > 0) printf "%s\t%s\t%s\n", bin, $4, secs
          }
          AWK
          awk -f times.awk exhaustive.log | sort -k3 -rn > exhaustive-times.txt
          {
            echo "### The whole-domain tests, per binary"
            echo
            echo "| Binary | Exhaustive tests | Seconds |"
            echo "| :--- | ---: | ---: |"
            awk '{ printf "| `%s` | %s | %s |\n", $1, $2, $3 }' exhaustive-times.txt
            awk '{ n += $2; s += $3 } END { printf "| **the tests** | **%d** | **%.2f** |\n", n, s }' exhaustive-times.txt
          } >> "$GITHUB_STEP_SUMMARY"
          cat exhaustive-times.txt

      - name: Keep the per-binary times for the round that reads them
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: exhaustive-times
          path: |
            exhaustive-times.txt
            exhaustive.log
          retention-days: 90

  mutants-weekly:
    # One job per area, because the areas cost different things (ADR-0058): a state crate's
    # suite is about a second and the runtime's is 140, so one automatic timeout - five times
    # the *workspace* baseline, while a mutant runs only its own package's tests - paid for a
    # hung one-second suite at thirty-six minutes, and fourteen such mutants were 96 % of the
    # sweep that ran out of time on 2026-09-14. Splitting by area also scopes the tool's own
    # baseline to the area, which is half the fix; the other half is that the bound is measured
    # on the runner rather than written down. The two areas together are the whole tree, which
    # the completeness check below asserts rather than assumes.
    name: Weekly mutation sweep (${{ matrix.label }}, ADR-0058)
    if: github.event_name == 'schedule' || inputs.scope == 'both' || inputs.scope == 'mutants'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      # One area that fails must not hide what the other found; the completeness check is
      # per area, so a missing area is a failed job and never a quiet gap.
      fail-fast: false
      matrix:
        include:
          # 2 417 mutants, swept in 24 minutes: one job (run 35252449360).
          - label: crates
            area: crates
            packages: --workspace --exclude cortex-runtime --exclude cortex-bench
            shard: ""
          # 979 mutants against a suite of 359 s on a hosted runner: 590 of them took 5 h 23 m,
          # so the area is about nine hours and is sharded at ceil(9 h / 90 min). Round-robin,
          # not the tool's default slice, because this tree's expensive mutants cluster by file.
          # Measured (run 35284722491): the six shards took 1 h 10 m to 1 h 58 m.
          - label: runtime-0
            area: runtime
            packages: -p cortex-runtime
            shard: --shard 0/6 --sharding round-robin
          - label: runtime-1
            area: runtime
            packages: -p cortex-runtime
            shard: --shard 1/6 --sharding round-robin
          - label: runtime-2
            area: runtime
            packages: -p cortex-runtime
            shard: --shard 2/6 --sharding round-robin
          - label: runtime-3
            area: runtime
            packages: -p cortex-runtime
            shard: --shard 3/6 --sharding round-robin
          - label: runtime-4
            area: runtime
            packages: -p cortex-runtime
            shard: --shard 4/6 --sharding round-robin
          - label: runtime-5
            area: runtime
            packages: -p cortex-runtime
            shard: --shard 5/6 --sharding round-robin
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install the pinned toolchain (rust-toolchain.toml, ADR-0009)
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: mutants

      # For the timeout reader below; the runner image ships a Node, but which one is not this
      # repository's to assume.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      - name: Install cargo-mutants at its pin
        run: cargo install cargo-mutants --locked --version 27.1.0

      # The timeout is derived here rather than written down, because a number measured on a
      # developer machine does not transfer: this area's suite is 140 s locally and was still
      # running when a 420-second bound cut it on a hosted runner (run 35249647298). The step
      # also stands in for the tool's own baseline, which `--timeout` would otherwise bound
      # along with the mutants, and fails the job if the unmutated tests fail - the guarantee
      # `--baseline=skip` gives up.
      - name: The area's own tests, timed, as the bound this runner needs
        run: |
          started=$SECONDS
          cargo test ${{ matrix.packages }} --locked
          elapsed=$((SECONDS - started))
          # Three times the area's own suite plus half a minute: the tool's own default is
          # five times a baseline, and a bound below the suite would record a slow mutant as a
          # timeout, which V-6 counts as caught - a survivor hidden by the clock.
          echo "MUTANT_TIMEOUT=$((elapsed * 3 + 30))" >> "$GITHUB_ENV"
          echo "the ${{ matrix.area }} suite took ${elapsed}s on this runner"

      - name: The area under mutation (survivors are listed, nothing is blocked)
        run: |
          echo "per-mutant timeout: ${MUTANT_TIMEOUT}s"
          set +e
          cargo mutants --file "${{ matrix.area }}/**" ${{ matrix.shard }} --baseline=skip --timeout "$MUTANT_TIMEOUT" --jobs 2
          code=$?
          set -e
          echo "MUTANTS_EXIT=$code" >> "$GITHUB_ENV"
          echo "cargo-mutants exit code $code"
          echo "== survivors"; cat mutants.out/missed.txt || true
          echo "== timeouts"; cat mutants.out/timeout.txt || true

      - name: "The sweep covered the area (ADR-0058: a partial sweep is a failed job)"
        run: |
          # 0 no survivor, 2 a survivor, 3 a timeout: the tool reached a verdict. Anything
          # else (a cancelled step, the tool's own error) is not a sweep.
          case "$MUTANTS_EXIT" in
            0|2|3) ;;
            *) echo "cargo-mutants ended with $MUTANTS_EXIT, which is not a verdict"; exit 1 ;;
          esac
          # The same filter and the same shard arguments, which is what the tool requires of
          # every shard of one sweep: an area is complete when each of its shards is.
          expected=$(cargo mutants --list --file "${{ matrix.area }}/**" ${{ matrix.shard }} | wc -l)
          tested=0
          for outcome in caught missed timeout unviable; do
            n=$(wc -l < "mutants.out/$outcome.txt" 2>/dev/null || echo 0)
            echo "$outcome: $n"
            tested=$((tested + n))
          done
          echo "tested $tested of $expected mutants under ${{ matrix.area }}/** (${{ matrix.label }})"
          {
            echo "### Mutation sweep: ${{ matrix.label }}"
            echo "Tested $tested of $expected mutants at a ${MUTANT_TIMEOUT}s bound; cargo-mutants exit $MUTANTS_EXIT."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$tested" -ne "$expected" ]; then
            echo "an incomplete sweep is not a result (ADR-0058)"
            exit 1
          fi

      # `timeout.txt` is a list of names and no more, and telling a hang from a mutant that was
      # passing slowly beside one took a round an afternoon of reading `debug.log` and the
      # per-mutant logs by hand (F-42). The job already keeps all of it; this reads it into the
      # artifact the next round opens. It reports and does not classify: the verdict is the
      # triage rule of ADR-0062, applied by that round.
      - name: What the timeouts were doing when the bound cut them (F-42, ADR-0063)
        if: always()
        run: |
          mkdir -p mutants.out
          node scripts/read-timeouts.mjs mutants.out | tee mutants.out/timeout-evidence.txt
          {
            echo "### Timeouts: ${{ matrix.label }}"
            echo '```'
            cat mutants.out/timeout-evidence.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the run's outcome (survivors, timeouts, the log) for the round that reads it
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutants-out-${{ matrix.label }}
          path: mutants.out
          retention-days: 90

  specs:
    # The name is a required status check of the repository's ruleset.
    name: Documentation (spec-guard, spec-graph)
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The base's copy of the whitepaper is read below, so the base commit must be here.
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install pinned tools
        run: npm ci

      # One step, not one per check. A list here and a list in `package.json` drift, and they
      # did: `spec:decisions` was added to `npm run spec`, to CONTRIBUTING.md and to CLAUDE.md
      # on 2026-09-20 and to this file not at all, so for two days a check three documents
      # called blocking ran on a developer machine only (F-44). `npm run spec` is the command
      # CONTRIBUTING.md names; every check inside it prints its own name, file and line, and
      # `spec:scripts:test` holds the list to containing them all.
      - name: The documentation gate (spec-guard, spec-graph, briefs, decisions, version, deps)
        run: npm run spec

      # Only a pull request has a base to compare the whitepaper with; `npm run spec` above
      # checked that its two version declarations agree, and this that the version moved with
      # the document's content (ADR-0064).
      - name: "The whitepaper's version moved with its content (ADR-0064)"
        if: github.event_name == 'pull_request'
        run: |
          git show "${{ github.event.pull_request.base.sha }}:docs/WHITEPAPER.md" > "$RUNNER_TEMP/base-whitepaper.md"
          npm run spec:version -- --base "$RUNNER_TEMP/base-whitepaper.md"
